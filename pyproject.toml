[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "port-tariff"
version = "0.1.0"
description = "Port Tariff Calculator (Transnet NPA, 23rd Edition, 2024/2025) — v1 engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["tariffs*"]
