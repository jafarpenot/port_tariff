# "running of vessel lines dues" benchmark figure. See adapter.py /
# config/assignment_mapping.yaml (Stage 2) and README §3.8/§3.9 mapping.
# Per service (x2 here). Fires on every marine service (berthing/unberthing).
# Column order: Richards Bay | Port Elizabeth/Ngqura | Cape Town | Saldanha |
# Other Ports. Durban, East London and Mossel Bay fall under "Other Ports".
# ---------------------------------------------------------------------------
berthing_services:
  source: {section: "3.8", page: 18}
  rounding: ceil_per_100_t
  per_service: true

  ports:
    richards_bay:    {base_fee: 3175.89, per_100t: 13.46}
    durban:          {base_fee: 2801.91, per_100t: 13.68}  # "Other Ports" column; verified in SPEC.md §7.6.
    east_london:     {base_fee: 2801.91, per_100t: 13.68}  # "Other Ports" column.
    ngqura:          {base_fee: 3838.62, per_100t: 18.72}  # shared PE/Ngqura column.
    port_elizabeth:  {base_fee: 3838.62, per_100t: 18.72}  # shared PE/Ngqura column.
    mossel_bay:      {base_fee: 2801.91, per_100t: 13.68}  # "Other Ports" column.
    cape_town:       {base_fee: 3052.33, per_100t: 14.92}
    saldanha:        {base_fee: 4006.34, per_100t: 16.97}

  surcharges:
    source: {section: "3.8", page: 18}
    standard_50pct:
      rate: 0.50
      conditions:
        - "Service terminates or commences outside ordinary working hours."
        - "Cancellation of standby, at any time after standby has commenced."
        - "Vessel arrives or departs 30 minutes or more after the notified time."

  tanker_attendance_mossel_bay_saldanha_per_hour: 1267.83

# ---------------------------------------------------------------------------
# §3.9 Running of vessel lines — page 19.
#
# THE SEMANTIC MISMATCH (see SPEC.md §7.6 and README): the assignment's
# "running of vessel lines dues" benchmark figure does NOT reconcile to this
# section — it reconciles to §3.8 Berthing Services above. This section is
# modelled and its calculator is implemented (Stage 2), but per SPEC.md §7.6
# item 3, its charge is PARSED, NOT CALCULATED in v1: gated on
# `mooring_boat_used`, it must produce a warning rather than a computed
# amount. Column order: Port Elizabeth/Ngqura | Cape Town | Saldanha |
# Other Ports. Durban, Richards Bay, East London and Mossel Bay fall under
# "Other Ports".
# ---------------------------------------------------------------------------
running_of_vessel_lines:
  source: {section: "3.9", page: 19}
  rounding: ceil_per_100_t   # Not applicable in v1 — no GT-based component; retained for schema symmetry.
  per_service: true
  status: parsed_not_calculated
  note: >
    v1 does not calculate this charge. If VesselCall.mooring_boat_used is
    true, the result must carry a warning that a §3.9 charge applies but is
    not computed in this version (SPEC.md §7.6 item 3).

  # "Per service" and "if the service terminates/commences outside ordinary
  # working hours, minimum" — two distinct printed fee lines per port.
  ports:
    richards_bay:    {per_service: 1654.56, outside_hours_minimum: 3309.05}  # "Other Ports" column.
    durban:          {per_service: 1654.56, outside_hours_minimum: 3309.05}  # "Other Ports" column; verified figure in SPEC.md §7.6.
    east_london:     {per_service: 1654.56, outside_hours_minimum: 3309.05}  # "Other Ports" column.
    ngqura:          {per_service: 2266.73, outside_hours_minimum: 4533.42}  # shared PE/Ngqura column.
    port_elizabeth:  {per_service: 2266.73, outside_hours_minimum: 4533.42}  # shared PE/Ngqura column.
    mossel_bay:      {per_service: 1654.56, outside_hours_minimum: 3309.05}  # "Other Ports" column.
    cape_town:       {per_service: 2370.84, outside_hours_minimum: 3309.05}
    saldanha:        {per_service: 2085.59, outside_hours_minimum: 4171.18}

  # Second printed table (same page), for late arrival/departure: charges
  # per hour or part thereof from the notified time until service is
  # complete. Identical to the table above except Cape Town's
  # outside-hours-minimum figure differs in the book (4 741.69 vs 3 309.05).
  late_arrival_departure_per_hour:
    richards_bay:    {per_service: 1654.56, outside_hours_minimum: 3309.05}
    durban:          {per_service: 1654.56, outside_hours_minimum: 3309.05}
    east_london:     {per_service: 1654.56, outside_hours_minimum: 3309.05}
    ngqura:          {per_service: 2266.73, outside_hours_minimum: 4533.42}
    port_elizabeth:  {per_service: 2266.73, outside_hours_minimum: 4533.42}
    mossel_bay:      {per_service: 1654.56, outside_hours_minimum: 3309.05}
    cape_town:       {per_service: 2370.84, outside_hours_minimum: 4741.69}
    saldanha:        {per_service: 2085.59, outside_hours_minimum: 4171.18}

  cancelled_after_standby_commenced:
    minimum_hours: 2
    per_hour_or_part_thereof: 1654.56

  saldanha_remooring_without_tug_or_pilot_per_service: 4739.14

# ---------------------------------------------------------------------------
# 9.4 Marine services incentive — §3.2, page 12
# Volume discount per shipping line, based on national call counts. The
# VesselCall model carries no shipping-line identity or call-count field, so
# this can never be evaluated from the supplied input in v1 — included here
# for completeness only per SPEC.md §9.4. Applies to pilotage, craft
# assistance (towage) and berthing services.
# ---------------------------------------------------------------------------
marine_services_incentive:
  source: {section: "3.2", page: 12}
  status: not_supported_by_input
  applies_to: [pilotage, towage, berthing_services]
  thresholds:
    - {vessel_cargo_type: container,     threshold_calls: 500, discount_per_step: 0.01, calls_per_step: 50, max_calls_for_discount: 1500}
